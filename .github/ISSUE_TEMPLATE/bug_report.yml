name: Bug report
description: Something does not work as it should
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting. For a security problem, please use a private report instead
        (Security > Report a vulnerability).
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what happened, and what you expected instead.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: EdgeDeck version
      description: Hover the EdgeDeck icon in the notification area to see it.
      placeholder: "1.0.0"
    validations:
      required: true
  - type: input
    id: windows
    attributes:
      label: Windows version
      placeholder: "Windows 11 24H2"
    validations:
      required: true
  - type: textarea
    id: displays
    attributes:
      label: Monitors
      description: How many, their resolution and scaling, and which one is the primary.
  - type: textarea
    id: log
    attributes:
      label: Log
      description: The end of the log (EdgeDeck menu > Open log). After a crash, please also attach the newest .dmp file from %LOCALAPPDATA%\EdgeDeck\crashes.
      render: text
