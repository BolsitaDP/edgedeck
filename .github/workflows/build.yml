name: build

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

jobs:
  windows:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4

      # The developer tools (tools/) are built too, never run: they call into the real
      # code, so a signature that changes under them should fail here, not the next time
      # someone needs one.
      - name: Configure
        run: cmake -S . -B build -G "Visual Studio 17 2022" -A x64 -DEDGEDECK_BUILD_TOOLS=ON

      - name: Build
        run: cmake --build build --config Release -- /m

      # The unit tests: everything that decides what the windows do without needing a desktop to
      # look at (config, placement, layouts, shortcuts, translations, icons, crash handling...).
      # What needs one is in tools/scripts, run by hand.
      - name: Test
        run: ctest --test-dir build -C Release --output-on-failure

      # The same zip a release carries (EdgeDeck.exe, the installer and the uninstaller), so a
      # branch's build can be tried on another machine without compiling it there. Symbols are
      # kept apart: they are 12 MB and only a crash dump needs them.
      - name: Package
        shell: pwsh
        run: ./scripts/package.ps1

      # The setup program too (Inno Setup, pinned and checked by get-innosetup.ps1).
      - name: Setup program
        shell: pwsh
        run: |
          $iscc = ./scripts/get-innosetup.ps1
          ./scripts/installer.ps1 -Iscc $iscc

      - name: Upload package
        uses: actions/upload-artifact@v4
        with:
          name: EdgeDeck-package
          path: |
            dist/*.zip
            dist/*-setup-*.exe
            dist/*.sha256

      - name: Upload symbols
        uses: actions/upload-artifact@v4
        with:
          name: EdgeDeck-symbols
          path: dist/*.pdb

  # MSVC's static analysis over the app, with every finding an error. It was brought to zero, so
  # anything it reports is new - a possible null, an unchecked call, a buffer it cannot prove big
  # enough. A finding that is wrong is suppressed on its line, with the reason beside it.
  analyze:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4

      - name: Configure
        run: cmake -S . -B build-analyze -G "Visual Studio 17 2022" -A x64 "-DCMAKE_CXX_FLAGS=/analyze /analyze:external- /EHsc /WX"

      - name: Analyze
        run: cmake --build build-analyze --config Release --target EdgeDeck -- /m

  # Windows on ARM. Built and packaged, tests included in the build so they still compile; they
  # cannot run here, on an x64 runner. The code has nothing architecture-specific, and this is
  # what keeps it that way.
  arm64:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4

      - name: Configure
        run: cmake -S . -B build-arm64 -G "Visual Studio 17 2022" -A ARM64

      - name: Build
        run: cmake --build build-arm64 --config Release -- /m

      - name: Package
        shell: pwsh
        run: ./scripts/package.ps1 -Architecture arm64

      - name: Setup program
        shell: pwsh
        run: |
          $iscc = ./scripts/get-innosetup.ps1
          ./scripts/installer.ps1 -Architecture arm64 -Iscc $iscc

      - name: Upload package
        uses: actions/upload-artifact@v4
        with:
          name: EdgeDeck-package-arm64
          path: |
            dist/*.zip
            dist/*-setup-*.exe
            dist/*.sha256
