name: release

# Pushing a tag vMAJOR.MINOR.PATCH builds that commit, runs the tests, and publishes a GitHub
# release with the packages (x64 and ARM64), their symbols and checksums, and the winget
# manifests for them. The version in the executable is the tag's, so the file says what the
# release says, and the notes are that version's section of CHANGELOG.md.
#
# "Run workflow" (Actions > release) is a rehearsal: the same steps for the version typed in, with
# the notes taken from "## [Unreleased]", and the result kept as a build artifact instead of
# being published. Nothing is tagged and nothing is released.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to rehearse (major.minor.patch)'
        required: true
        default: '1.0.0'

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4

      - name: Version
        id: version
        shell: pwsh
        run: |
          $publish = '${{ github.event_name }}' -eq 'push'
          $v = if ($publish) { '${{ github.ref_name }}'.TrimStart('v') } else { '${{ inputs.version }}' }
          if ($v -notmatch '^\d+\.\d+\.\d+$') { throw "'$v' is not major.minor.patch (tag vMAJOR.MINOR.PATCH)" }
          "version=$v" >> $env:GITHUB_OUTPUT
          "publish=$($publish.ToString().ToLowerInvariant())" >> $env:GITHUB_OUTPUT
          "unreleased=$(if ($publish) { '' } else { '-Unreleased' })" >> $env:GITHUB_OUTPUT

      # Before anything is built: a tag whose version has no CHANGELOG.md section stops here.
      - name: Check the release notes exist
        shell: pwsh
        run: ./scripts/release-notes.ps1 -Version ${{ steps.version.outputs.version }} ${{ steps.version.outputs.unreleased }} | Out-Null

      # Quoted: PowerShell splits an unquoted -DNAME=1.2.3 at the dots before CMake sees it.
      - name: Configure
        run: cmake -S . -B build -G "Visual Studio 17 2022" -A x64 "-DEDGEDECK_VERSION=${{ steps.version.outputs.version }}"

      - name: Build
        run: cmake --build build --config Release -- /m

      - name: Test
        run: ctest --test-dir build -C Release --output-on-failure

      - name: Package
        shell: pwsh
        run: ./scripts/package.ps1 -Version ${{ steps.version.outputs.version }}

      # Windows on ARM: the same version, built here too (it cannot be tested on this runner).
      - name: Package for ARM64
        shell: pwsh
        run: ./scripts/package.ps1 -Architecture arm64 -Build -Version ${{ steps.version.outputs.version }}

      - name: Release notes
        shell: pwsh
        run: ./scripts/release-notes.ps1 -Version ${{ steps.version.outputs.version }} ${{ steps.version.outputs.unreleased }} -OutFile dist/notes.md

      # The manifests for microsoft/winget-pkgs, with these zips' checksums, attached to the release
      # so submitting it is a copy. winget is not on the runner, so they are not validated here; on a
      # machine with winget, scripts/winget.ps1 validates them.
      - name: winget manifests
        shell: pwsh
        run: |
          $v = '${{ steps.version.outputs.version }}'
          ./scripts/winget.ps1 -Version $v -Homepage '${{ github.server_url }}/${{ github.repository }}'
          Compress-Archive -Path dist/winget/manifests -DestinationPath "dist/EdgeDeck-$v-winget-manifests.zip"

      - name: Publish
        if: steps.version.outputs.publish == 'true'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" (Get-ChildItem dist/*.zip, dist/*.pdb, dist/*.sha256).FullName `
            --title "EdgeDeck ${{ steps.version.outputs.version }}" --notes-file dist/notes.md

      - name: Keep the rehearsal
        if: steps.version.outputs.publish != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: release-rehearsal-${{ steps.version.outputs.version }}
          path: |
            dist/*.zip
            dist/*.pdb
            dist/*.sha256
            dist/notes.md
