name: release

# Pushing a tag vMAJOR.MINOR.PATCH builds that commit, runs the tests, and publishes a GitHub
# release with the package, its symbols and its checksum. The version in the executable is the
# tag's, so the file says what the release says.
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4

      - name: Version from the tag
        id: version
        shell: pwsh
        run: |
          $v = '${{ github.ref_name }}'.TrimStart('v')
          if ($v -notmatch '^\d+\.\d+\.\d+$') { throw "Tag '${{ github.ref_name }}' is not vMAJOR.MINOR.PATCH" }
          "version=$v" >> $env:GITHUB_OUTPUT

      # Quoted: PowerShell splits an unquoted -DNAME=1.2.3 at the dots before CMake sees it.
      - name: Configure
        run: cmake -S . -B build -G "Visual Studio 17 2022" -A x64 "-DEDGEDECK_VERSION=${{ steps.version.outputs.version }}"

      - name: Build
        run: cmake --build build --config Release -- /m

      - name: Test
        run: ctest --test-dir build -C Release --output-on-failure

      - name: Package
        shell: pwsh
        run: ./scripts/package.ps1 -Version ${{ steps.version.outputs.version }}

      - name: Publish
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" (Get-ChildItem dist/*.zip, dist/*.pdb, dist/*.sha256).FullName `
            --title "EdgeDeck ${{ steps.version.outputs.version }}" --generate-notes